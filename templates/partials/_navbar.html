<nav class="bg-white border-b border-gray-200 px-4 py-2.5 dark:bg-gray-800 dark:border-gray-700 fixed left-0 right-0 top-0 z-50">
  <div class="container flex flex-wrap justify-between items-center mx-auto">
    <!-- Left Section - Logo -->
    <a href="/" class="flex items-center">
      <p class="text-blue-800 text-xl sm:text-2xl font-bold cursor-pointer">Rohit Samaaj</p>
    </a>

    <!-- Right Section - Desktop Navigation & Mobile Toggle -->
    <div class="flex items-center md:order-2">
      <!-- Desktop Navigation (Feedback & Avatar) -->
      <div class="hidden md:flex items-center space-x-4">
        <button class="px-4 py-2 bg-blue-100 rounded-lg text-gray-900 text-sm hover:bg-blue-200">Feedback</button>
        <div class="relative">
          <!-- Avatar Button -->
          <button id="avatarDropdownButton" data-dropdown-toggle="avatarDropdown" class="flex items-center space-x-2">
            {% if request.user.profile.avatar %}
              <img src="{{ request.user.profile.avatar }}" alt="{{ request.user.get_full_name }}" class="w-8 h-8 rounded-full cursor-pointer focus:ring-2 focus:ring-blue-100 active:ring-2 active:ring-blue-50">
            {% else %}
              <img src="https://placehold.co/160x160?text={{ request.user.first_name|slice:'0:1' }}+{{ request.user.last_name|slice:'0:1' }}" alt="{{ request.user.get_full_name }}" class="w-8 h-8 rounded-full cursor-pointer focus:ring-2 focus:ring-blue-100 active:ring-2 active:ring-blue-50">
            {% endif %}
          </button>

          <!-- Dropdown Menu -->
          <div id="avatarDropdown" class="hidden absolute right-0 z-10 w-48 bg-white rounded-lg shadow-lg divide-y divide-gray-100">
            <div class="px-4 py-3 text-sm text-gray-900">
              <p class="font-medium">{{ request.user.get_full_name }}</p>
              <p class="text-xs text-gray-500">{{ request.user.email }}</p>
            </div>
            <ul class="py-1 text-sm text-gray-700">
              <li>
                <a href="{% url 'users:profile' %}" class="block px-4 py-2 hover:bg-gray-100">Profile</a>
              </li>
            </ul>
            <div class="py-1">
              <form method="POST" action="{% url 'users:account_logout' %}">
                {% csrf_token %}
                <button type="submit" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-100">Logout</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Toggle Button (Hamburger) -->
      <button data-drawer-target="drawer-right-example" data-drawer-toggle="drawer-right-example" data-drawer-placement="right" aria-controls="drawer-right-example" type="button" class="inline-flex items-center p-2 ml-1 text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600">
        <span class="sr-only">Open main menu</span>
        <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg>
      </button>
    </div>
  </div>
</nav>

<!-- Drawer Component -->
<div id="drawer-right-example" class="fixed top-0 right-0 z-40 h-screen p-4 overflow-y-auto transition-transform translate-x-full bg-white w-80 dark:bg-gray-800 md:hidden" tabindex="-1" aria-labelledby="drawer-right-label">
  <div class="flex justify-between items-center mb-6">
    <h5 id="drawer-right-label" class="inline-flex items-center text-base font-semibold text-gray-500 uppercase dark:text-gray-400"><svg class="w-5 h-5 mr-2" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9.293 12.95a1 1 0 00.002 1.414l.002.002a1 1 0 001.414-.002l.002-.002a1 1 0 00-.002-1.414l-.002-.002a1 1 0 00-1.414.002z" clip-rule="evenodd"></path></svg>Menu</h5>
    <button type="button" data-drawer-hide="drawer-right-example" aria-controls="drawer-right-example" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 inline-flex items-center justify-center dark:hover:bg-gray-600 dark:hover:text-white">
      <svg class="w-3 h-3" aria-hidden="true" fill="none" viewBox="0 0 14 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
      </svg>
      <span class="sr-only">Close menu</span>
    </button>
  </div>

  <div class="py-4 overflow-y-auto">
    <!-- Profile Section -->
    <div class="flex flex-col items-center p-4 border-b border-gray-200 dark:border-gray-700 mb-4">
      {% if request.user.profile.avatar %}
        <img src="{{ request.user.profile.avatar }}" alt="{{ request.user.get_full_name }}" class="w-16 h-16 rounded-full mb-2">
      {% else %}
        <img src="https://placehold.co/160x160?text={{ request.user.first_name|slice:'0:1' }}+{{ request.user.last_name|slice:'0:1' }}" alt="{{ request.user.get_full_name }}" class="w-16 h-16 rounded-full mb-2">
      {% endif %}
      <p class="text-lg font-semibold text-gray-900 dark:text-white">{{ request.user.get_full_name }}</p>
      <p class="text-sm text-gray-500 dark:text-gray-400">{{ request.user.email }}</p>
    </div>

    <ul class="space-y-2 font-medium">
      <li>
        <button class="block px-4 py-2 text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 w-full text-left rounded-lg">Feedback</button>
      </li>
      <li>
        <a href="{% url 'users:profile' %}" class="block px-4 py-2 text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 w-full text-left rounded-lg">Profile</a>
      </li>
      <li>
        <form method="POST" action="{% url 'users:account_logout' %}">
          {% csrf_token %}
          <button type="submit" class="block px-4 py-2 text-red-600 hover:bg-red-100 dark:text-red-500 dark:hover:bg-red-700 w-full text-left rounded-lg">Logout</button>
        </form>
      </li>
    </ul>
  </div>
</div>
