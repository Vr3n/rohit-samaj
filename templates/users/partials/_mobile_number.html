<div id="mobile-number-container">
    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400">Phone</dt>
    <dd class="text-sm text-gray-900 dark:text-white">{{ user_profile.phone_number }}</dd>
    <button hx-get="{% url 'users:edit_mobile_number' %}" hx-target="#mobile-number-container" hx-swap="outerHTML" type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Edit Phone</button>
</div>
