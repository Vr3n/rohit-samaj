{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen space-y-6">
    <header class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Welcome, {{ request.user.get_full_name }}</h1>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-1 md:col-span-full">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Actions</h2>
                <div class="flex gap-4">
                    <a href="{% url 'survey:survey_form' %}" class="h-14 flex items-center justify-center text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Add New Samaaj Member</a>
                    <a href="#" class="h-14 flex items-center justify-center text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700">View Samaaj Members</a>
                </div>
            </div>
        </div>
        <div class="col-span-1 md:col-span-full">
            <div id="profile-completion-container" hx-get="{% url 'survey:profile_completion' %}" hx-trigger="load"></div>
        </div>
        <div class="col-span-full lg:col-span-3">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">My Metrics</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-blue-100 p-4 rounded-lg">
                        <p class="text-blue-800 text-2xl font-bold">{{ request.user.samajmember_set.count }}</p>
                        <p class="text-blue-600">Total Members</p>
                    </div>
                    <div class="bg-green-100 p-4 rounded-lg">
                        <p class="text-green-800 text-2xl font-bold">0</p>
                        <p class="text-green-600">This Month</p>
                    </div>
                    <div class="bg-purple-100 p-4 rounded-lg">
                        <p class="text-purple-800 text-2xl font-bold">0</p>
                        <p class="text-purple-600">This Week</p>
                    </div>
                    <div class="bg-orange-100 p-4 rounded-lg">
                        <p class="text-orange-800 text-2xl font-bold">0</p>
                        <p class="text-orange-600">Pending Approvals</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- <div class="bg-white p-6 rounded-lg shadow-md flex items-center justify-between"> -->

    <!--     </div> -->
    <!--     <a href="#" class="text-blue-600 hover:underline">View All &rarr;</a> -->

</div>
{% endblock content %}
